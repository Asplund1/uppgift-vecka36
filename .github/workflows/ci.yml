name: CI

on:
  push:
    branches:
      - dev

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t asplund1/frontend:latest ./frontend
      - run: |
          cd frontend
          npm install
          npm test

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t asplund1/api:latest ./api
      - run: |
          cd api
          npm install
          npm test