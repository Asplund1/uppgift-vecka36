name: CI

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t asplund1/min-tjanst:latest ./frontend
      
      - name: Run tests
        run: |
          cd frontend
          npm install
          npm test