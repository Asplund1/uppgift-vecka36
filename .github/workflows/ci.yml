name: CI

on:
  push:
    branches:
      - dev

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build runtime image
        run: docker build -t dockerasplund/frontend:latest ./frontend

      - name: Push runtime image
        run: docker push dockerasplund/frontend:latest

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t asplund1/api:latest ./api
      - run: |
          cd api
          npm install
          npm test