version: "3.9"

services:
  frontend:
    image: dockerasplund/frontend:v1.0.0   # <-- byt mellan v1.0.0 / v1.1.0 / latest
    build:
      context: ./frontend                  # används om du bygger lokalt
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    image: dockerasplund/api:latest        # här kan du också börja versionera senare
    build:
      context: ./api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://user:pass@db:5432/mydb
    depends_on:
      - db

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
